name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, such as v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Build standalone artifact
        run: ./build.sh

      - name: Run smoke suite
        env:
          TERM: xterm-256color
          NO_COLOR: ''
          LC_ALL: C.UTF-8
          MOMA_TEST_TTY: '0'
        run: ./tests/smoke.sh

      - name: Verify release version
        run: |
          version="$(./dist/moma version)"
          [[ "v${version}" == "${RELEASE_TAG}" ]]

      - name: Prepare release binary
        run: |
          install -Dm0755 dist/moma release/moma
          test -x release/moma

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/moma
          fail_on_unmatched_files: true
